<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Four steps from a proposal to real outcomes, the last one still empty">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<text x="100" y="142" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#2A8C82" text-anchor="start" font-weight="bold" opacity="1.0">OMNEQUA</text>
<text x="100" y="267" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#1B2733" text-anchor="start" font-weight="normal" opacity="1.0">Is our credit</text>
<text x="100" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#1B2733" text-anchor="start" font-weight="normal" opacity="1.0">assessment credible?</text>
<line x1="102" y1="380" x2="176" y2="380" stroke="#D9962B" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<circle cx="866" cy="294" r="220" fill="#BFE0DA" opacity="0.28"/>
<rect x="690" y="440" width="70" height="70" rx="6" fill="#BFE0DA" stroke="#1B2733" stroke-width="2"/>
<text x="725" y="534" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">Proposal</text>
<rect x="768" y="366" width="70" height="144" rx="6" fill="#F2D9A6" stroke="#1B2733" stroke-width="2"/>
<text x="803" y="534" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">Source</text>
<rect x="846" y="292" width="70" height="218" rx="6" fill="#BFE0DA" stroke="#1B2733" stroke-width="2"/>
<text x="881" y="534" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">Running</text>
<rect x="924" y="218" width="70" height="292" rx="6" fill="none" stroke="#1B2733" stroke-width="2" stroke-dasharray="6 6"/>
<text x="959" y="534" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">Outcomes</text>
<line x1="690" y1="510" x2="994" y2="510" stroke="#1B2733" stroke-width="2.5" stroke-linecap="round" opacity="1.0"/>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
