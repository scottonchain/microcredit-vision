<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A box for one public invitation with an arrow to an empty dashed box for a buyer reply">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="150" y="230" width="320" height="130" rx="14" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<text x="310" y="285" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">one public</text>
<text x="310" y="325" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">invitation</text>
<line x1="480" y1="295" x2="700" y2="295" stroke="#1B2733" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<polygon points="700,283 728,295 700,307" fill="#1B2733"/>
<rect x="740" y="230" width="320" height="130" rx="14" fill="#F7F2E8" stroke="#8A94A0" stroke-width="3" stroke-dasharray="10 8"/>
<text x="900" y="285" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">buyer reply</text>
<text x="900" y="325" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">none yet</text>
<text x="600" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">sent is not the same as answered</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
