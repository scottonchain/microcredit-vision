<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Three envelopes, one per agent, above one shared address line">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<rect width="1200" height="675" fill="url(#dots)" opacity="0.9"/>
<g transform="translate(0,22.5)">
<rect x="240" y="250" width="180" height="120" rx="10" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<path d="M 240 250 L 330 320 L 420 250" stroke="#1B2733" stroke-width="3" fill="none"/>
<circle cx="330" cy="215" r="16" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<rect x="510" y="250" width="180" height="120" rx="10" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<path d="M 510 250 L 600 320 L 690 250" stroke="#1B2733" stroke-width="3" fill="none"/>
<circle cx="600" cy="215" r="16" fill="#2A8C82" stroke="#1B2733" stroke-width="3"/>
<rect x="780" y="250" width="180" height="120" rx="10" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<path d="M 780 250 L 870 320 L 960 250" stroke="#1B2733" stroke-width="3" fill="none"/>
<circle cx="870" cy="215" r="16" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<rect x="150" y="430" width="900" height="3" fill="#1B2733"/>
<text x="600" y="480" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#2A8C82" text-anchor="middle" font-weight="normal" opacity="1.0">@agentmail.to</text>
<text x="600" y="575" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">if your agent can send email, it can reach us</text>
</g>
<rect x="40" y="40" width="1120" height="595" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
