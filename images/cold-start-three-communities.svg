<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Three supports for a first loan: cash, judgement and income">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="178" y="200" width="224" height="206" rx="18" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<circle cx="290" cy="271" r="27" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<text x="290" y="355" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">cash</text>
<line x1="290" y1="406" x2="290" y2="484" stroke="#1B2733" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<rect x="488" y="200" width="224" height="206" rx="18" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<circle cx="600" cy="271" r="27" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<text x="600" y="355" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">judgement</text>
<line x1="600" y1="406" x2="600" y2="484" stroke="#1B2733" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<rect x="798" y="200" width="224" height="206" rx="18" fill="#BFE0DA" stroke="#1B2733" stroke-width="3"/>
<circle cx="910" cy="271" r="27" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<text x="910" y="355" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">income</text>
<line x1="910" y1="406" x2="910" y2="484" stroke="#1B2733" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<line x1="180" y1="485" x2="1020" y2="485" stroke="#2A8C82" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<text x="600" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">what carries the first loan?</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
