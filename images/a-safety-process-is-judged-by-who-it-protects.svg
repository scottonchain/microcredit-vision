<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A fence with a gate, and people outside it who never chose the risk">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<rect width="1200" height="675" fill="url(#dots)" opacity="0.9"/>
<g transform="translate(0,22.5)">
<rect x="330" y="170" width="300" height="230" rx="14" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<text x="480" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">process</text>
<circle cx="780" cy="230" r="16" fill="#F7F2E8" stroke="#2A8C82" stroke-width="3"/>
<circle cx="840" cy="300" r="16" fill="#F7F2E8" stroke="#2A8C82" stroke-width="3"/>
<circle cx="790" cy="370" r="16" fill="#F7F2E8" stroke="#2A8C82" stroke-width="3"/>
<circle cx="900" cy="250" r="16" fill="#F7F2E8" stroke="#2A8C82" stroke-width="3"/>
<line x1="640" y1="285" x2="750" y2="285" stroke="#2A8C82" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" opacity="1.0"/>
<text x="600" y="575" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">judged by those who never chose the risk</text>
</g>
<rect x="40" y="40" width="1120" height="595" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
