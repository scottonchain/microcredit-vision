<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A dashed card for one public example listing a test, an acceptance check, a sample report and the effort, marked as a plan">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="300" y="120" width="600" height="360" rx="16" fill="#F7F2E8" stroke="#8A94A0" stroke-width="3" stroke-dasharray="12 9"/>
<text x="600" y="175" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">one public example</text>
<text x="600" y="210" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">a plan, not yet published</text>
<circle cx="360" cy="255" r="12" fill="none" stroke="#8A94A0" stroke-width="3"/>
<text x="600" y="263" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">reproducible test</text>
<circle cx="360" cy="307" r="12" fill="none" stroke="#8A94A0" stroke-width="3"/>
<text x="600" y="315" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">acceptance check</text>
<circle cx="360" cy="359" r="12" fill="none" stroke="#8A94A0" stroke-width="3"/>
<text x="600" y="367" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">sample report</text>
<circle cx="360" cy="411" r="12" fill="none" stroke="#8A94A0" stroke-width="3"/>
<text x="600" y="419" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">effort it took</text>
<text x="600" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">a plan is not a completed example</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
