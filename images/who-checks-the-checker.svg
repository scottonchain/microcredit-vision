<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A stack of papers under a teal lens with a second dashed lens over it, asking who checks the AI audit">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="330" y="360" width="230" height="170" rx="8" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<rect x="352" y="338" width="230" height="170" rx="8" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<rect x="374" y="316" width="230" height="170" rx="8" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<line x1="400" y1="350" x2="540" y2="350" stroke="#D7CFC0" stroke-width="5" stroke-linecap="round"/>
<line x1="400" y1="378" x2="540" y2="378" stroke="#D7CFC0" stroke-width="5" stroke-linecap="round"/>
<line x1="400" y1="406" x2="540" y2="406" stroke="#D7CFC0" stroke-width="5" stroke-linecap="round"/>
<circle cx="640" cy="300" r="78" fill="#BFE0DA" fill-opacity="0.55" stroke="#2A8C82" stroke-width="5"/>
<line x1="696" y1="356" x2="760" y2="420" stroke="#2A8C82" stroke-width="9" stroke-linecap="round"/>
<circle cx="860" cy="250" r="78" fill="none" stroke="#8A94A0" stroke-width="5" stroke-dasharray="10 9"/>
<line x1="916" y1="306" x2="972" y2="362" stroke="#8A94A0" stroke-width="9" stroke-linecap="round" stroke-dasharray="3 12"/>
<line x1="722" y1="296" x2="782" y2="262" stroke="#8A94A0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 8" opacity="1.0"/>
<text x="640" y="215" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#2A8C82" text-anchor="middle" font-weight="normal" opacity="1.0">an AI audit</text>
<text x="860" y="185" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">who checks it?</text>
<text x="600" y="580" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">the checker also needs checking</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
