<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An input, an operating budget and income connected in sequence">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<text x="600" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">WHO FUNDS THE WORK?</text>
<rect x="140" y="225" width="240" height="175" rx="18" fill="#F7F2E8" stroke="#2A8C82" stroke-width="4"/><text x="260" y="325" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">INPUT</text>
<rect x="480" y="225" width="240" height="175" rx="18" fill="#F7F2E8" stroke="#2A8C82" stroke-width="4"/><text x="600" y="325" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">BUDGET</text>
<rect x="820" y="225" width="240" height="175" rx="18" fill="#F7F2E8" stroke="#2A8C82" stroke-width="4"/><text x="940" y="325" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">INCOME</text>
<line x1="390" y1="310" x2="470" y2="310" stroke="#D9962B" stroke-width="6" stroke-linecap="round" opacity="1.0"/>
<line x1="730" y1="310" x2="810" y2="310" stroke="#D9962B" stroke-width="6" stroke-linecap="round" opacity="1.0"/>
<text x="600" y="500" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">THE AGENT ECONOMY</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
