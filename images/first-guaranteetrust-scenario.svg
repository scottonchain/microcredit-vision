<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Three paid jobs on a fixed track, each returning a small contribution to a reserve">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<text x="600" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">one worker, three paid jobs, a fixed script</text>
<line x1="150" y1="370" x2="1050" y2="370" stroke="#D7CFC0" stroke-width="4"/>
<text x="330" y="215" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#D9962B" text-anchor="middle" font-weight="normal" opacity="1.0">wage paid</text>
<circle cx="330" cy="250" r="16" fill="#F2D9A6" stroke="#1B2733" stroke-width="2.5"/>
<line x1="330" y1="266" x2="330" y2="342" stroke="#D9962B" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<circle cx="330" cy="370" r="26" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<text x="330" y="378" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">1</text>
<line x1="330" y1="398" x2="600" y2="470" stroke="#2A8C82" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" opacity="1.0"/>
<text x="600" y="215" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#D9962B" text-anchor="middle" font-weight="normal" opacity="1.0">wage paid</text>
<circle cx="600" cy="250" r="16" fill="#F2D9A6" stroke="#1B2733" stroke-width="2.5"/>
<line x1="600" y1="266" x2="600" y2="342" stroke="#D9962B" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<circle cx="600" cy="370" r="26" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<text x="600" y="378" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">2</text>
<line x1="600" y1="398" x2="600" y2="470" stroke="#2A8C82" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" opacity="1.0"/>
<text x="870" y="215" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#D9962B" text-anchor="middle" font-weight="normal" opacity="1.0">wage paid</text>
<circle cx="870" cy="250" r="16" fill="#F2D9A6" stroke="#1B2733" stroke-width="2.5"/>
<line x1="870" y1="266" x2="870" y2="342" stroke="#D9962B" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<circle cx="870" cy="370" r="26" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<text x="870" y="378" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">3</text>
<line x1="870" y1="398" x2="600" y2="470" stroke="#2A8C82" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" opacity="1.0"/>
<rect x="520" y="470" width="160" height="56" rx="12" fill="#BFE0DA" stroke="#2A8C82" stroke-width="3"/>
<text x="600" y="505" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">reserve</text>
<text x="600" y="585" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">a scripted test, no agent decided anything</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
