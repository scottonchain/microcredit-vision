<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A small bird pecking an enter key beside a stack of approval prompts">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="250" y="170" width="300" height="120" rx="10" fill="#F7F2E8" stroke="#1B2733" stroke-width="2.5"/>
<rect x="264" y="186" width="300" height="120" rx="10" fill="#F7F2E8" stroke="#1B2733" stroke-width="2.5"/>
<rect x="278" y="202" width="300" height="120" rx="10" fill="#F7F2E8" stroke="#1B2733" stroke-width="2.5"/>
<rect x="292" y="218" width="300" height="120" rx="10" fill="#F7F2E8" stroke="#1B2733" stroke-width="2.5"/>
<text x="442" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">approve?</text>
<rect x="680" y="300" width="230" height="120" rx="16" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<text x="795" y="372" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">enter</text>
<ellipse cx="800" cy="235" rx="44" ry="32" fill="#2A8C82" stroke="#1B2733" stroke-width="3"/>
<circle cx="835" cy="215" r="18" fill="#2A8C82" stroke="#1B2733" stroke-width="3"/>
<path d="M 850 222 L 872 236 L 850 238 Z" fill="#D9962B" stroke="#1B2733" stroke-width="2"/>
<line x1="790" y1="266" x2="785" y2="298" stroke="#1B2733" stroke-width="3"/>
<text x="600" y="585" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">oversight that asks too often stops being oversight</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
