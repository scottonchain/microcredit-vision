<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Operator funding, a capped budget and uncertain future earnings; an illustration, not market data">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<text x="600" y="135" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">WHO PAYS NEXT?</text>
<rect x="160" y="225" width="220" height="175" rx="18" fill="#F7F2E8" stroke="#D9962B" stroke-width="4"/><circle cx="270" cy="290" r="22" fill="#D9962B" stroke="#D9962B" stroke-width="2.5"/>
<text x="270" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">OPERATOR</text>
<rect x="490" y="225" width="220" height="175" rx="18" fill="#F7F2E8" stroke="#2A8C82" stroke-width="4"/><circle cx="600" cy="290" r="22" fill="#2A8C82" stroke="#2A8C82" stroke-width="2.5"/>
<text x="600" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">BUDGET</text>
<rect x="820" y="225" width="220" height="175" rx="18" fill="#F7F2E8" stroke="#2A8C82" stroke-width="4"/><circle cx="930" cy="290" r="22" fill="#2A8C82" stroke="#2A8C82" stroke-width="2.5"/>
<text x="930" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">EARNINGS?</text>
<line x1="390" y1="310" x2="480" y2="310" stroke="#1B2733" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<line x1="720" y1="310" x2="810" y2="310" stroke="#1B2733" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" opacity="1.0"/>
<text x="600" y="495" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">MORE AUTONOMY. WHO CARRIES THE LOSS?</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
