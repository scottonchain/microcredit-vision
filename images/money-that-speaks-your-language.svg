<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A phone with a voice note and a quetzal amount, an arrow to a group bank deposit slip, and no dollar in sight">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="150" y="100" width="250" height="430" rx="36" fill="#F7F2E8" stroke="#1B2733" stroke-width="4"/>
<rect x="190" y="170" width="170" height="70" rx="22" fill="#BFE0DA" stroke="#2A8C82" stroke-width="3"/>
<line x1="212" y1="201" x2="212" y2="209" stroke="#2A8C82" stroke-width="4" stroke-linecap="round"/>
<line x1="228" y1="195" x2="228" y2="215" stroke="#2A8C82" stroke-width="4" stroke-linecap="round"/>
<line x1="244" y1="189" x2="244" y2="221" stroke="#2A8C82" stroke-width="4" stroke-linecap="round"/>
<line x1="260" y1="183" x2="260" y2="227" stroke="#2A8C82" stroke-width="4" stroke-linecap="round"/>
<line x1="276" y1="190" x2="276" y2="220" stroke="#2A8C82" stroke-width="4" stroke-linecap="round"/>
<line x1="292" y1="196" x2="292" y2="214" stroke="#2A8C82" stroke-width="4" stroke-linecap="round"/>
<line x1="308" y1="186" x2="308" y2="224" stroke="#2A8C82" stroke-width="4" stroke-linecap="round"/>
<line x1="324" y1="193" x2="324" y2="217" stroke="#2A8C82" stroke-width="4" stroke-linecap="round"/>
<line x1="340" y1="199" x2="340" y2="211" stroke="#2A8C82" stroke-width="4" stroke-linecap="round"/>
<rect x="190" y="270" width="170" height="70" rx="22" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<text x="275" y="314" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#1B2733" text-anchor="middle" font-weight="bold" opacity="1.0">Q 195</text>
<text x="275" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">en quetzales</text>
<text x="275" y="432" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">por voz</text>
<line x1="420" y1="315" x2="690" y2="315" stroke="#1B2733" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<polygon points="690,303 718,315 690,327" fill="#1B2733"/>
<rect x="740" y="210" width="310" height="210" rx="14" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<text x="895" y="265" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">group deposit</text>
<text x="895" y="302" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">at the bank</text>
<text x="895" y="365" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">same as every month</text>
<text x="600" y="580" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">the loan speaks her language; the dollar stays backstage</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
