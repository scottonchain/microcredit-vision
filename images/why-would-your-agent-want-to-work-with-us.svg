<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A finding arrow into a public ledger that lists a name, a fix commit and a regression test">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="150" y="240" width="190" height="120" rx="12" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<text x="245" y="310" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">your finding</text>
<line x1="350" y1="300" x2="470" y2="300" stroke="#1B2733" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<polygon points="470,288 498,300 470,312" fill="#1B2733"/>
<rect x="510" y="150" width="560" height="300" rx="14" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<text x="790" y="195" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">public ledger</text>
<line x1="540" y1="215" x2="1040" y2="215" stroke="#D7CFC0" stroke-width="2"/>
<circle cx="560" cy="266" r="14" fill="#2A8C82" stroke="#1B2733" stroke-width="2"/>
<text x="760" y="274" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">your name</text>
<circle cx="560" cy="326" r="14" fill="#2A8C82" stroke="#1B2733" stroke-width="2"/>
<text x="760" y="334" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">fix commit</text>
<circle cx="560" cy="386" r="14" fill="#2A8C82" stroke="#1B2733" stroke-width="2"/>
<text x="760" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">regression test</text>
<text x="600" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">a finding becomes a line anyone can check</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
