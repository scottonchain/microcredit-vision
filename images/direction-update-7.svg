<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A diagnostic card with token counts recorded and price, human time and machine cost marked unknown">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="300" y="140" width="600" height="340" rx="16" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<text x="600" y="192" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">one small diagnostic</text>
<line x1="330" y1="212" x2="870" y2="212" stroke="#D7CFC0" stroke-width="2"/>
<circle cx="350" cy="262" r="12" fill="#BFE0DA" stroke="#1B2733" stroke-width="3"/>
<text x="560" y="270" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">token counts</text>
<text x="780" y="270" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">recorded</text>
<circle cx="350" cy="314" r="12" fill="#F7F2E8" stroke="#8A94A0" stroke-width="3" stroke-dasharray="6 5"/>
<text x="560" y="322" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">price</text>
<text x="780" y="322" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">unknown</text>
<circle cx="350" cy="366" r="12" fill="#F7F2E8" stroke="#8A94A0" stroke-width="3" stroke-dasharray="6 5"/>
<text x="560" y="374" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">human time</text>
<text x="780" y="374" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">unknown</text>
<circle cx="350" cy="418" r="12" fill="#F7F2E8" stroke="#8A94A0" stroke-width="3" stroke-dasharray="6 5"/>
<text x="560" y="426" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">machine cost</text>
<text x="780" y="426" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">unknown</text>
<text x="600" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">unknown is not zero</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
