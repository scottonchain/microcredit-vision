  <g id="text_15">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #687774" transform="translate(51.84 80.437969)">Illustrative 10% annual rate, simple interest. Loan revenue is not profit.</text>
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #687774" transform="translate(51.84 97.958516)">The reference cost is one published execution-fee example, not a measured loan cost.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #687774" transform="translate(51.84 452.722656)">Sources: author calculation; Base fee documentation, checked Nov 1, 2026. Example: 200,000 gas × 0.005 gwei × $2,000/ETH.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #687774" transform="translate(51.84 466.2)">The ETH price is Base’s example assumption. Excludes L1, priority/operator fees and all other lending costs.</text>
