<circle cx="490" cy="302" r="11" fill="none" stroke="#8A94A0" stroke-width="3"/>
<text x="600" y="309" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">scope</text>
