<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="One sponsor dollar beside a column of wages that clients pay">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<line x1="150" y1="470" x2="1050" y2="470" stroke="#1B2733" stroke-width="3"/>
<rect x="640" y="400" width="260" height="56" rx="8" fill="#BFE0DA" stroke="#1B2733" stroke-width="2.5"/>
<rect x="640" y="338" width="260" height="56" rx="8" fill="#BFE0DA" stroke="#1B2733" stroke-width="2.5"/>
<rect x="640" y="276" width="260" height="56" rx="8" fill="#BFE0DA" stroke="#1B2733" stroke-width="2.5"/>
<rect x="640" y="214" width="260" height="56" rx="8" fill="#BFE0DA" stroke="#1B2733" stroke-width="2.5"/>
<text x="770" y="190" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#2A8C82" text-anchor="middle" font-weight="normal" opacity="1.0">wages clients pay</text>
<circle cx="420" cy="410" r="52" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<text x="420" y="424" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">$1</text>
<line x1="478" y1="410" x2="628" y2="410" stroke="#D9962B" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" opacity="1.0"/>
<text x="420" y="515" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#D9962B" text-anchor="middle" font-weight="normal" opacity="1.0">refund, only on failure</text>
<text x="600" y="585" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">one dollar standing behind several</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
