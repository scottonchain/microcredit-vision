<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A loan bar of 100 beside taller collateral bars of 121 to 154 that must be held first">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<line x1="180" y1="470" x2="1020" y2="470" stroke="#1B2733" stroke-width="2.5" stroke-linecap="round" opacity="1.0"/>
<rect x="250" y="370" width="150" height="100" fill="#2A8C82" stroke="#1B2733" stroke-width="3"/>
<text x="325" y="504" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">borrow 100</text>
<rect x="520" y="349" width="150" height="121" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<text x="595" y="335" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">121</text>
<rect x="680" y="327" width="150" height="143" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<text x="755" y="313" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">143</text>
<rect x="840" y="316" width="150" height="154" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<text x="915" y="302" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">154</text>
<line x1="160" y1="370" x2="1040" y2="370" stroke="#8A94A0" stroke-width="2" stroke-dasharray="6 8"/>
<text x="740" y="504" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">to hold first, by asset</text>
<text x="600" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">to borrow 100, first hold 121 to 154</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
