<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An open envelope, a short question going in and a reply coming back">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="380" y="230" width="440" height="260" rx="14" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<path d="M 380 230 L 600 400 L 820 230" fill="none" stroke="#1B2733" stroke-width="3"/>
<path d="M 380 230 L 600 120 L 820 230" fill="#F2D9A6" stroke="#D9962B" stroke-width="4" stroke-linejoin="round"/>
<line x1="430" y1="440" x2="620" y2="440" stroke="#8A94A0" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<line x1="430" y1="465" x2="560" y2="465" stroke="#8A94A0" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<line x1="190" y1="330" x2="360" y2="330" stroke="#2A8C82" stroke-width="4" stroke-linecap="round" opacity="1.0"/>
<path d="M 340 318 L 362 330 L 340 342 Z" fill="#2A8C82"/>
<text x="275" y="305" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#2A8C82" text-anchor="middle" font-weight="normal" opacity="1.0">one question</text>
<line x1="840" y1="390" x2="1010" y2="390" stroke="#D9962B" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" opacity="1.0"/>
<path d="M 990 378 L 1012 390 L 990 402 Z" fill="#D9962B"/>
<text x="925" y="425" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#D9962B" text-anchor="middle" font-weight="normal" opacity="1.0">a reply in about a day</text>
<text x="600" y="585" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">no name is ever published; the record counts messages</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
