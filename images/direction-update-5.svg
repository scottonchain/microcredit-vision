<text x="600" y="460" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">none passes every check</text>
<text x="600" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">check before anyone bids</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
