    <dc:title>capital-resilience</dc:title>
    <dc:date>2026-11-01</dc:date>
    <dc:description>World Bank 2024 data: all adults versus adults in poorest 40% of households able to raise emergency funds within 30 days, with no more than some difficulty. Low income 43.8% versus 34.7%; lower middle income 40.6% versus 28.5%; upper middle income 74.6% versus 60.7%. Target is 5% of GNI per capita in local currency.</dc:description>
