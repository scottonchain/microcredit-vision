<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Four roles around one pool: lender, borrower, backer and issuer">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="470" y="250" width="260" height="130" rx="14" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<text x="600" y="322" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">the pool</text>
<circle cx="230" cy="315" r="40" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<line x1="272" y1="315" x2="462" y2="315" stroke="#1B2733" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<polygon points="462,315 444,305 444,325" fill="#1B2733"/>
<text x="230" y="395" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">lender</text>
<circle cx="970" cy="315" r="40" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<line x1="738" y1="315" x2="926" y2="315" stroke="#D9962B" stroke-width="4" stroke-linecap="round" opacity="1.0"/>
<polygon points="926,315 908,305 908,325" fill="#D9962B"/>
<text x="1040" y="322" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="start" font-weight="normal" opacity="1.0">borrower</text>
<circle cx="970" cy="500" r="30" fill="#BFE0DA" stroke="#1B2733" stroke-width="3"/>
<line x1="970" y1="357" x2="970" y2="468" stroke="#2A8C82" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" opacity="1.0"/>
<text x="1040" y="508" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="start" font-weight="normal" opacity="1.0">backer</text>
<rect x="940" y="120" width="60" height="60" rx="10" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<line x1="970" y1="182" x2="970" y2="273" stroke="#1B2733" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8" opacity="1.0"/>
<text x="1040" y="158" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="start" font-weight="normal" opacity="1.0">issuer</text>
<text x="600" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">limits never exceed credit issued, dues paid and stake committed</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
