<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="One signed request sent twice: the first is paid, the second stopped by a used counter">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="170" y="250" width="150" height="110" rx="10" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<path d="M 170 262 L 245 322 L 320 262" fill="none" stroke="#1B2733" stroke-width="3"/>
<text x="245" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">one signed request</text>
<line x1="330" y1="290" x2="760" y2="190" stroke="#1B2733" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<polygon points="760,178 790,190 764,206" fill="#1B2733"/>
<rect x="800" y="150" width="220" height="80" rx="12" fill="#2A8C82" stroke="#1B2733" stroke-width="3"/>
<text x="910" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#F7F2E8" text-anchor="middle" font-weight="normal" opacity="1.0">paid once</text>
<line x1="330" y1="330" x2="700" y2="400" stroke="#1B2733" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" opacity="1.0"/>
<rect x="700" y="340" width="18" height="130" fill="#1B2733"/>
<rect x="740" y="380" width="280" height="80" rx="12" fill="#F7F2E8" stroke="#1B2733" stroke-width="3" stroke-dasharray="8 8"/>
<text x="880" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">counter already used</text>
<text x="600" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">the second try pays nothing</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
