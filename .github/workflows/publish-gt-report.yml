name: Publish operator-directed GuaranteeTrust report

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-gt-report.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify blog tooling
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/build.py --check
      - name: Build publication
        run: python3 tools/build.py
      - name: Commit generated publication files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md feed.xml tags posts
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Publish live GuaranteeTrust scenario report"
          git push origin HEAD:main
