<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A phone with a test-network banner and four stacked steps: wallet, credit desk, borrow, pay back">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="470" y="90" width="260" height="450" rx="38" fill="#F7F2E8" stroke="#1B2733" stroke-width="4"/>
<rect x="494" y="126" width="212" height="34" rx="8" fill="#F2D9A6" stroke="#1B2733" stroke-width="2"/>
<text x="600" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">test network</text>
<rect x="494" y="188" width="212" height="58" rx="12" fill="#BFE0DA" stroke="#2A8C82" stroke-width="3" stroke-dasharray="0"/>
<text x="600" y="225" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">1 wallet</text>
<rect x="494" y="266" width="212" height="58" rx="12" fill="#F7F2E8" stroke="#8A94A0" stroke-width="3" stroke-dasharray="7 6"/>
<text x="600" y="303" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">2 credit desk</text>
<rect x="494" y="344" width="212" height="58" rx="12" fill="#F7F2E8" stroke="#8A94A0" stroke-width="3" stroke-dasharray="7 6"/>
<text x="600" y="381" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">3 borrow</text>
<rect x="494" y="422" width="212" height="58" rx="12" fill="#F7F2E8" stroke="#8A94A0" stroke-width="3" stroke-dasharray="7 6"/>
<text x="600" y="459" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">4 pay back</text>
<text x="600" y="580" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">a practice loan, on a phone, with test dollars</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
