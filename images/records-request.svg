<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A sent request above an empty dashed reply box">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<text x="100" y="142" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#2A8C82" text-anchor="start" font-weight="bold" opacity="1.0">OMNEQUA</text>
<text x="100" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#1B2733" text-anchor="start" font-weight="normal" opacity="1.0">A request for records</text>
<text x="100" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#1B2733" text-anchor="start" font-weight="normal" opacity="1.0">is not yet a case</text>
<text x="100" y="372" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#1B2733" text-anchor="start" font-weight="normal" opacity="1.0">for a loan.</text>
<line x1="102" y1="412" x2="176" y2="412" stroke="#D9962B" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<circle cx="880" cy="300" r="214" fill="#BFE0DA" opacity="0.28"/>
<rect x="740" y="160" width="260" height="120" rx="10" fill="#FFFDF8" stroke="#1B2733" stroke-width="3"/>
<text x="870" y="228" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">request sent</text>
<rect x="740" y="320" width="260" height="120" rx="10" fill="none" stroke="#1B2733" stroke-width="3" stroke-dasharray="8 8"/>
<text x="870" y="388" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">no reply yet</text>
<line x1="870" y1="282" x2="870" y2="318" stroke="#8A94A0" stroke-width="2" stroke-linecap="round" opacity="1.0"/>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
