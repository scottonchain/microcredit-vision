<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Two people with a promise crossing the gap between them">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<circle cx="300" cy="330" r="120" fill="#BFE0DA" opacity="0.55"/>
<circle cx="900" cy="330" r="120" fill="#F2D9A6" opacity="0.75"/>
<circle cx="300" cy="330" r="46" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<circle cx="900" cy="330" r="46" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<path d="M 346 318 C 480 160, 720 160, 854 318" fill="none" stroke="#1B2733" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
<path d="M 346 345 C 480 480, 720 480, 854 345" fill="none" stroke="#D9962B" stroke-width="4" stroke-linecap="round"/>
<polygon points="854,345 832,331 836,356" fill="#D9962B"/>
<text x="600" y="178" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">a promise</text>
<text x="600" y="490" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">repayment</text>
<text x="600" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">credit, from credere: to trust</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
