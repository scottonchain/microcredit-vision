<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Two levers: one held by an assistant, one at a front desk a person can pull alone">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="170" y="170" width="300" height="250" rx="16" fill="#F7F2E8" stroke="#8A94A0" stroke-width="4"/>
<text x="320" y="215" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">held by the assistant</text>
<line x1="320" y1="380" x2="320" y2="270" stroke="#8A94A0" stroke-width="6" stroke-linecap="round" opacity="1.0"/>
<circle cx="320" cy="262" r="20" fill="#D7CFC0" stroke="#8A94A0" stroke-width="3"/>
<rect x="730" y="170" width="300" height="250" rx="16" fill="#F7F2E8" stroke="#2A8C82" stroke-width="4"/>
<text x="880" y="215" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#2A8C82" text-anchor="middle" font-weight="normal" opacity="1.0">front desk</text>
<line x1="880" y1="380" x2="960" y2="290" stroke="#2A8C82" stroke-width="6" stroke-linecap="round" opacity="1.0"/>
<circle cx="965" cy="283" r="20" fill="#BFE0DA" stroke="#2A8C82" stroke-width="3"/>
<text x="880" y="330" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" fill="#1B2733" text-anchor="middle" font-weight="bold" opacity="1.0">Go</text>
<line x1="480" y1="300" x2="720" y2="300" stroke="#D7CFC0" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" opacity="1.0"/>
<text x="600" y="595" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">a lever a person can reach alone</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
