<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="One cracked wall beside five thin layers, the last one dashed, asking how anyone would know the layers hold">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="170" y="200" width="70" height="250" rx="8" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<path d="M 205 200 L 190 260 L 222 310 L 196 370 L 212 450" fill="none" stroke="#1B2733" stroke-width="3"/>
<text x="205" y="495" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">one wall</text>
<rect x="560" y="215" width="34" height="230" rx="6" fill="#BFE0DA" stroke="#2A8C82" stroke-width="3"/>
<rect x="670" y="255" width="34" height="190" rx="6" fill="#BFE0DA" stroke="#2A8C82" stroke-width="3"/>
<rect x="780" y="195" width="34" height="250" rx="6" fill="#BFE0DA" stroke="#2A8C82" stroke-width="3"/>
<rect x="890" y="235" width="34" height="210" rx="6" fill="#BFE0DA" stroke="#2A8C82" stroke-width="3"/>
<rect x="1000" y="205" width="34" height="240" rx="6" fill="#F7F2E8" stroke="#8A94A0" stroke-width="3" stroke-dasharray="9 8"/>
<text x="780" y="495" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#2A8C82" text-anchor="middle" font-weight="normal" opacity="1.0">many imperfect layers</text>
<text x="600" y="565" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">how would anyone know the layers hold?</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
