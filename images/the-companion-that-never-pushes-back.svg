<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Two speech bubbles to one person: one says only yes, the other says to ask about them">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<circle cx="600" cy="470" r="40" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<line x1="600" y1="510" x2="600" y2="560" stroke="#1B2733" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<rect x="150" y="150" width="300" height="150" rx="22" fill="#F7F2E8" stroke="#8A94A0" stroke-width="4"/>
<polygon points="280,300 320,300 360,410" fill="#F7F2E8" stroke="#8A94A0" stroke-width="4"/>
<text x="300" y="238" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" fill="#8A94A0" text-anchor="middle" font-weight="bold" opacity="1.0">yes</text>
<rect x="750" y="150" width="300" height="150" rx="22" fill="#F7F2E8" stroke="#2A8C82" stroke-width="4"/>
<polygon points="880,300 920,300 840,410" fill="#F7F2E8" stroke="#2A8C82" stroke-width="4"/>
<text x="900" y="238" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" fill="#2A8C82" text-anchor="middle" font-weight="bold" opacity="1.0">ask about them</text>
<line x1="360" y1="410" x2="570" y2="450" stroke="#8A94A0" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" opacity="1.0"/>
<line x1="840" y1="410" x2="630" y2="450" stroke="#2A8C82" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" opacity="1.0"/>
<text x="600" y="595" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">pleasant is not the same as aligned</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
