<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An agent box holding a switch that reaches toward a monitor box it cannot touch">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="150" y="170" width="330" height="230" rx="18" fill="#F7F2E8" stroke="#8A94A0" stroke-width="4"/>
<text x="315" y="215" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">agent</text>
<rect x="250" y="270" width="130" height="50" rx="25" fill="#C9553F" stroke="#1B2733" stroke-width="3"/>
<circle cx="275" cy="295" r="18" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<text x="315" y="365" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">its own switch</text>
<rect x="720" y="170" width="330" height="230" rx="18" fill="#F7F2E8" stroke="#2A8C82" stroke-width="4"/>
<text x="885" y="215" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#2A8C82" text-anchor="middle" font-weight="normal" opacity="1.0">monitor</text>
<circle cx="885" cy="295" r="38" fill="#BFE0DA" stroke="#2A8C82" stroke-width="4"/>
<circle cx="885" cy="295" r="12" fill="#1B2733" stroke="#1B2733" stroke-width="2"/>
<text x="885" y="365" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">outside its reach</text>
<line x1="380" y1="295" x2="715" y2="295" stroke="#8A94A0" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" opacity="1.0"/>
<text x="600" y="595" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">oversight the overseen can switch off is a request, not a check</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
