<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A machine&#x27;s claim passing a checker with a few written rules, then a dashed box asking why">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="110" y="215" width="270" height="190" rx="16" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<text x="245" y="295" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" fill="#1B2733" text-anchor="middle" font-weight="bold" opacity="1.0">a claim</text>
<text x="245" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">from a machine</text>
<line x1="385" y1="310" x2="470" y2="310" stroke="#1B2733" stroke-width="4" stroke-linecap="round" opacity="1.0"/>
<rect x="475" y="215" width="250" height="190" rx="16" fill="#BFE0DA" stroke="#2A8C82" stroke-width="4"/>
<path d="M 540 310 L 585 355 L 662 262" fill="none" stroke="#2A8C82" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="445" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#2A8C82" text-anchor="middle" font-weight="normal" opacity="1.0">a checker with a few written rules</text>
<line x1="730" y1="310" x2="815" y2="310" stroke="#1B2733" stroke-width="4" stroke-linecap="round" opacity="1.0"/>
<rect x="820" y="215" width="270" height="190" rx="16" fill="#F7F2E8" stroke="#8A94A0" stroke-width="3" stroke-dasharray="9 8"/>
<text x="955" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" fill="#1B2733" text-anchor="middle" font-weight="bold" opacity="1.0">why?</text>
<text x="955" y="445" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">still ours to understand</text>
<text x="600" y="565" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">trust the checker, then ask why</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
