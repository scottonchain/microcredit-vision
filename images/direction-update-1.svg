<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Two dashed empty boxes for a paid task and income, and one small proposed test below">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="150" y="200" width="300" height="130" rx="14" fill="#F7F2E8" stroke="#8A94A0" stroke-width="3" stroke-dasharray="10 8"/>
<text x="300" y="275" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">paid task</text>
<text x="300" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">none yet</text>
<rect x="750" y="200" width="300" height="130" rx="14" fill="#F7F2E8" stroke="#8A94A0" stroke-width="3" stroke-dasharray="10 8"/>
<text x="900" y="275" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">income</text>
<text x="900" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">none shown yet</text>
<line x1="460" y1="265" x2="740" y2="265" stroke="#8A94A0" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" opacity="1.0"/>
<rect x="420" y="400" width="360" height="90" rx="14" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<text x="600" y="455" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">one small proposed test</text>
<line x1="600" y1="395" x2="600" y2="345" stroke="#1B2733" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<polygon points="588,352 600,330 612,352" fill="#1B2733"/>
<text x="600" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">an honest status, not a result</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
