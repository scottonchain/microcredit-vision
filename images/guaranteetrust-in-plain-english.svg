<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A worker and a client joined by a job, a small shield under the worker standing on a stake and an issuer line">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<circle cx="330" cy="200" r="30" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<circle cx="870" cy="200" r="30" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<text x="330" y="258" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">worker</text>
<text x="870" y="258" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">client</text>
<line x1="370" y1="200" x2="830" y2="200" stroke="#1B2733" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<text x="600" y="178" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">a job, wage owed</text>
<path d="M 330 290 L 400 315 L 400 380 Q 400 430 330 455 Q 260 430 260 380 L 260 315 Z" fill="#F2D9A6" stroke="#D9962B" stroke-width="4"/>
<text x="330" y="383" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">up to $20</text>
<rect x="150" y="478" width="170" height="52" rx="10" fill="#BFE0DA" stroke="#2A8C82" stroke-width="3"/>
<rect x="340" y="478" width="170" height="52" rx="10" fill="#BFE0DA" stroke="#2A8C82" stroke-width="3"/>
<text x="235" y="511" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">a stake</text>
<text x="425" y="511" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">an issuer line</text>
<line x1="870" y1="275" x2="870" y2="345" stroke="#C9553F" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" opacity="1.0"/>
<text x="870" y="375" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#C9553F" text-anchor="middle" font-weight="normal" opacity="1.0">if the client does not pay</text>
<line x1="760" y1="395" x2="420" y2="395" stroke="#C9553F" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" opacity="1.0"/>
<text x="600" y="585" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">trust comes from money that can bear a loss</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
