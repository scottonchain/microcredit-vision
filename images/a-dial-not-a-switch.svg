<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A light switch crossed out beside a large dial turned partway">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<rect x="250" y="220" width="140" height="200" rx="14" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<rect x="300" y="250" width="40" height="70" rx="8" fill="#8A94A0" stroke="#1B2733" stroke-width="2.5"/>
<line x1="240" y1="210" x2="400" y2="430" stroke="#D9962B" stroke-width="6"/>
<circle cx="760" cy="320" r="130" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<line x1="760" y1="320" x2="690" y2="225" stroke="#2A8C82" stroke-width="10" stroke-linecap="round"/>
<circle cx="760" cy="320" r="14" fill="#1B2733" stroke="#1B2733" stroke-width="2"/>
<text x="600" y="575" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">turned by degrees, where people can reach it</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
