<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Agents find work, judge trust and review above a bounded treasury">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<text x="600" y="135" font-family="Georgia, 'Times New Roman', serif" font-size="33" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">A credit officer that cannot be bypassed</text>
<rect x="250" y="200" width="200" height="100" rx="16" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<text x="350" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">evidence</text>
<line x1="350" y1="300" x2="350" y2="375" stroke="#1B2733" stroke-width="2.5" stroke-linecap="round" opacity="1.0"/>
<rect x="500" y="200" width="200" height="100" rx="16" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<text x="600" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">officer</text>
<line x1="600" y1="300" x2="600" y2="375" stroke="#1B2733" stroke-width="2.5" stroke-linecap="round" opacity="1.0"/>
<rect x="750" y="200" width="200" height="100" rx="16" fill="#BFE0DA" stroke="#1B2733" stroke-width="3"/>
<text x="850" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">challenge</text>
<line x1="850" y1="300" x2="850" y2="375" stroke="#1B2733" stroke-width="2.5" stroke-linecap="round" opacity="1.0"/>
<rect x="230" y="375" width="740" height="105" rx="16" fill="#F7F2E8" stroke="#2A8C82" stroke-width="4"/>
<text x="600" y="438" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">mandatory approval</text>
<text x="600" y="550" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">one accountable office · enforceable limits</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
