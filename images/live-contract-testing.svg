<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Three kinds of testing evidence</title><desc id="desc">A solid teal path shows the recorded live test, an amber dashed path shows a local simulation, and an open circle marks testing still to come.</desc><rect width="1200" height="630" fill="#f7f2e6"/><text x="80" y="92" font-family="Georgia,serif" font-size="44" fill="#172b36">Follow the evidence</text><g font-family="Arial,sans-serif" font-size="28" fill="#172b36"><text x="80" y="211">LIVE TESTNET</text><text x="80" y="351">LOCAL SIMULATION</text><text x="80" y="491">STILL OPEN</text></g><path d="M490 200H1060" stroke="#087f80" stroke-width="12"/><g fill="#087f80"><circle cx="490" cy="200" r="22"/><circle cx="775" cy="200" r="22"/><circle cx="1060" cy="200" r="22"/></g><path d="M490 340H1060" stroke="#b87917" stroke-width="10" stroke-dasharray="20 16"/><g fill="#f7f2e6" stroke="#b87917" stroke-width="7"><circle cx="490" cy="340" r="22"/><circle cx="775" cy="340" r="22"/><circle cx="1060" cy="340" r="22"/></g><path d="M490 480H960" stroke="#172b36" stroke-width="7" stroke-dasharray="5 16"/><circle cx="1060" cy="480" r="32" fill="none" stroke="#172b36" stroke-width="7"/><text x="80" y="575" font-family="Arial,sans-serif" font-size="24" fill="#172b36">Test tokens. Recorded results. Clear limits.</text></svg>

