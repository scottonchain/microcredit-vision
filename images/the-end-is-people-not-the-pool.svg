<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Nested rings: people at the centre, the pool at the edge">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<circle cx="600" cy="300" r="250" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<circle cx="600" cy="300" r="180" fill="#F2D9A6" stroke="#1B2733" stroke-width="3"/>
<circle cx="600" cy="300" r="110" fill="#F7F2E8" stroke="#1B2733" stroke-width="3"/>
<circle cx="570" cy="300" r="14" fill="#2A8C82" stroke="#1B2733" stroke-width="3"/>
<circle cx="600" cy="300" r="14" fill="#2A8C82" stroke="#1B2733" stroke-width="3"/>
<circle cx="630" cy="300" r="14" fill="#2A8C82" stroke="#1B2733" stroke-width="3"/>
<text x="600" y="112" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">the pool</text>
<text x="600" y="182" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">the method</text>
<text x="600" y="585" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">the end is people</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
