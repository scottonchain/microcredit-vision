   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #687774" transform="translate(51.84 466.2)">Calculated fee = $100 × 2.9% + transaction count × $0.30. No international, currency-conversion or other extra fees modeled.</text>
