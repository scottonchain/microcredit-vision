<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A rising capability curve and a flat dashed control curve from one origin">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.1" fill="#D7CFC0"/>
  </pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9962B" stop-opacity="0.35"/><stop offset="1" stop-color="#D9962B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#dots)" opacity="0.9"/>
<line x1="160" y1="470" x2="1040" y2="470" stroke="#1B2733" stroke-width="2.5" stroke-linecap="round" opacity="1.0"/>
<line x1="160" y1="470" x2="160" y2="130" stroke="#1B2733" stroke-width="2.5" stroke-linecap="round" opacity="1.0"/>
<path d="M 170 450 C 500 440, 760 330, 1020 150" fill="none" stroke="#D9962B" stroke-width="6" stroke-linecap="round"/>
<path d="M 170 452 C 480 448, 760 440, 1020 428" fill="none" stroke="#2A8C82" stroke-width="5" stroke-dasharray="10 12" stroke-linecap="round"/>
<text x="930" y="135" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#D9962B" text-anchor="middle" font-weight="normal" opacity="1.0">capability</text>
<text x="940" y="415" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#2A8C82" text-anchor="middle" font-weight="normal" opacity="1.0">control</text>
<text x="600" y="505" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#8A94A0" text-anchor="middle" font-weight="normal" opacity="1.0">compute</text>
<text x="600" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1B2733" text-anchor="middle" font-weight="normal" opacity="1.0">a curve you can ride, and one nobody knows how to make</text>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1B2733" stroke-opacity="0.18" stroke-width="1.5" rx="6"/>
</svg>
